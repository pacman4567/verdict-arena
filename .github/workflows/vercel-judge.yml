name: Verify Vercel judge
on: [push, pull_request]
jobs:
  judge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/vercel-judge/package-lock.json
      - run: npm ci
        working-directory: services/vercel-judge
      - run: npm test
        working-directory: services/vercel-judge
      - name: Exercise Linux supervisor in disposable CI VM
        run: sudo env VERDICT_EPHEMERAL_TEST=1 PATH="$PATH" python3 services/vercel-judge/tests/runner_test.py
